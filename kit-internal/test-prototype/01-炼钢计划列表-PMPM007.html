<!DOCTYPE html>
<!--
  ════════════════════════════════════════════════════════════════════════
  原型「视觉真值」样例 · 炼钢计划列表（PMPM007 · LIST · D3 开发就绪）
  ────────────────────────────────────────────────────────────────────────
  · 定位：kit-internal 不发布层的「样例来源 / 地面真值」，与 test-flowcharts 同级。
  · 用途：闭环验证时，对照 examples/requirements/prototype/01-page-annotation.md
          （文字真值），确认 markdown 标注的结构/解构细致度「不低于」本视觉真值。
  · 对齐 wl-skills-kit  → prototype-scan 模式 A 期望的「Axure 导出 HTML」结构，
          单页 self-contained，可 open_browser_page / read_page 直接扫描。
  · 对齐 wl-skills-ui   → 复用 L3 list-page 骨架类（list-page__search/toolbar/
          table/pager）与 L0 设计令牌 CSS 变量（--el-color-primary 等）。
  · 数据：占位演示数据，字段 camelCase 与 spec IPO / 词典逐字一致，dict 标 dictCode。
  ════════════════════════════════════════════════════════════════════════
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>炼钢计划列表 · PMPM007</title>
  <style>
    /* ── L0 设计令牌（取自 wl-skills-ui/design/tokens/base.css 关键子集）── */
    :root {
      --el-color-primary: #2254f4;
      --el-color-primary-light-9: #f2f5ff;
      --el-color-success: #2bb268;
      --el-color-warning: #ea9a13;
      --el-color-danger: #bb2d3f;
      --el-color-info: #909399;
      --el-text-color-primary: #303133;
      --el-text-color-regular: #606266;
      --el-text-color-secondary: #909399;
      --el-border-color: #dcdfe6;
      --el-border-color-light: #e4e7ed;
      --el-bg-color: #ffffff;
      --el-bg-color-page: #f5f7fa;
      --el-border-radius-base: 4px;
      --el-font-size-base: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: var(--el-font-size-base);
      color: var(--el-text-color-primary);
      background: var(--el-bg-color-page);
    }

    /* ── L3 list-page 骨架（对齐 wl-skills-ui/styles/layouts/_list-page.scss）── */
    .list-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 12px;
      gap: 12px;
    }
    .list-page__search {
      background: var(--el-bg-color);
      padding: 16px 16px 4px;
      border-radius: var(--el-border-radius-base);
    }
    .list-page__toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 4px;
    }
    .list-page__table {
      flex: 1;
      min-height: 0;
      background: var(--el-bg-color);
      border-radius: var(--el-border-radius-base);
      overflow: auto;
    }
    .list-page__pager {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      padding: 8px 4px;
      color: var(--el-text-color-secondary);
    }

    /* ── 搜索区（el-form inline 仿真）── */
    .ep-form--inline { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; }
    .ep-form-item { display: flex; align-items: center; gap: 8px; }
    .ep-form-item__label { color: var(--el-text-color-regular); white-space: nowrap; }
    .ep-form-item__label.is-required::before { content: "*"; color: var(--el-color-danger); margin-right: 4px; }
    .ep-input, .ep-select {
      height: 32px; min-width: 180px; padding: 0 11px;
      border: 1px solid var(--el-border-color);
      border-radius: var(--el-border-radius-base);
      color: var(--el-text-color-primary); background: var(--el-bg-color);
      display: inline-flex; align-items: center;
    }
    .ep-select::after { content: "▾"; margin-left: auto; color: var(--el-text-color-secondary); }

    /* ── 按钮 ── */
    .ep-button {
      height: 32px; padding: 0 15px; border-radius: var(--el-border-radius-base);
      border: 1px solid var(--el-border-color); background: var(--el-bg-color);
      color: var(--el-text-color-regular); cursor: pointer; font-size: 14px;
    }
    .ep-button--primary { background: var(--el-color-primary); border-color: var(--el-color-primary); color: #fff; }
    .ep-button--danger  { background: var(--el-color-danger);  border-color: var(--el-color-danger);  color: #fff; }
    .ep-button--small   { height: 28px; padding: 0 9px; }
    .ep-button--text    { border: none; background: transparent; color: var(--el-color-primary); padding: 0 6px; height: 28px; }

    /* ── 表格 ── */
    .ep-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .ep-table th, .ep-table td {
      padding: 10px 12px; border-bottom: 1px solid var(--el-border-color-light);
      text-align: left; white-space: nowrap;
    }
    .ep-table thead th {
      background: var(--el-bg-color-page); color: var(--el-text-color-regular); font-weight: 600;
    }
    .ep-link { color: var(--el-color-primary); cursor: pointer; text-decoration: none; }

    /* ── 状态标签（dict 渲染示意）── */
    .ep-tag { padding: 1px 8px; border-radius: 10px; font-size: 12px; line-height: 20px; display: inline-block; }
    .ep-tag--info    { background: #f4f4f5; color: var(--el-color-info); }
    .ep-tag--warning { background: #fdf6ec; color: var(--el-color-warning); }
    .ep-tag--success { background: #eef9f1; color: var(--el-color-success); }
    .ep-tag--primary { background: var(--el-color-primary-light-9); color: var(--el-color-primary); }

    .pm-meta {
      background: var(--el-color-primary-light-9); color: var(--el-color-primary);
      padding: 8px 16px; border-radius: var(--el-border-radius-base);
      font-size: 13px; display: flex; gap: 18px; flex-wrap: wrap;
    }
    .pm-meta b { color: var(--el-color-primary); }
  </style>
</head>

<!-- prototype-scan 解析锚点：交互模式 / IPO 编码 / 服务缩写 / 目录名 / 深度 -->
<body
  data-pattern="LIST"
  data-ipo="PMPM007"
  data-flow="PMPM-A-01"
  data-service="produce"
  data-dir="smelting-plan"
  data-depth="D3"
>
  <div class="list-page">

    <!-- ① 页面元信息（人读，便于核对来源域）-->
    <div class="pm-meta">
      <span><b>页面</b>：炼钢计划列表</span>
      <span><b>交互模式</b>：LIST</span>
      <span><b>关联 IPO</b>：PMPM007 炼钢计划编制</span>
      <span><b>所属流程</b>：PMPM-A-01</span>
      <span><b>深度</b>：D3 开发就绪</span>
    </div>

    <!-- ② 查询区字段 -->
    <div class="list-page__search">
      <form class="ep-form ep-form--inline">
        <div class="ep-form-item">
          <label class="ep-form-item__label is-required">计划月份</label>
          <span class="ep-input" data-field="planMonth" data-component="month">2026-06</span>
        </div>
        <div class="ep-form-item">
          <label class="ep-form-item__label">钢种</label>
          <span class="ep-select" data-field="steelGrade" data-component="dict" data-dict-code="steel_grade">请选择</span>
        </div>
        <div class="ep-form-item">
          <label class="ep-form-item__label">计划状态</label>
          <span class="ep-select" data-field="planStatus" data-component="dict" data-dict-code="plan_status">请选择</span>
        </div>
        <div class="ep-form-item">
          <label class="ep-form-item__label">炉号</label>
          <span class="ep-input" data-field="heatNo" data-component="input">请输入</span>
        </div>
        <div class="ep-form-item">
          <button type="button" class="ep-button ep-button--primary">查询</button>
          <button type="button" class="ep-button">重置</button>
        </div>
      </form>
    </div>

    <!-- ④ 工具栏按钮 -->
    <div class="list-page__toolbar">
      <button class="ep-button ep-button--primary" data-action="openModal" data-perm="plan:add">新增</button>
      <button class="ep-button ep-button--danger"  data-action="batchDelete" data-perm="plan:del">删除</button>
      <button class="ep-button"                     data-action="export" data-perm="plan:export">导出</button>
    </div>

    <!-- ③ 表格列 + ⑤ 操作列 -->
    <div class="list-page__table">
      <table class="ep-table">
        <thead>
          <tr>
            <th style="width:40px"><input type="checkbox" /></th>
            <th data-field="heatNo" data-width="140" data-clickable="true">炉号</th>
            <th data-field="steelGrade" data-width="120" data-dict-code="steel_grade">钢种</th>
            <th data-field="planDate" data-width="120">计划日期</th>
            <th data-field="planWeight" data-width="120">计划重量(吨)</th>
            <th data-field="planStatus" data-width="110" data-dict-code="plan_status">计划状态</th>
            <th data-field="createdBy" data-width="100">创建人</th>
            <th style="width:240px">操作</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><input type="checkbox" /></td>
            <td><a class="ep-link">H260601-01</a></td>
            <td>Q235B</td>
            <td>2026-06-01</td>
            <td>120.00</td>
            <td><span class="ep-tag ep-tag--info">草稿</span></td>
            <td>张工</td>
            <td>
              <button class="ep-button--text" data-action="edit"   data-show="planStatus==='DRAFT'">编辑</button>
              <button class="ep-button--text" data-action="submit" data-show="planStatus==='DRAFT'">提交审核</button>
              <button class="ep-button--text" data-action="delete" data-show="planStatus==='DRAFT'">删除</button>
              <button class="ep-button--text" data-action="detail" data-show="any">查看</button>
            </td>
          </tr>
          <tr>
            <td><input type="checkbox" /></td>
            <td><a class="ep-link">H260601-02</a></td>
            <td>HRB400</td>
            <td>2026-06-01</td>
            <td>95.50</td>
            <td><span class="ep-tag ep-tag--warning">待审核</span></td>
            <td>李工</td>
            <td>
              <button class="ep-button--text" data-action="approve" data-show="planStatus==='PENDING' && hasPerm">审核通过</button>
              <button class="ep-button--text" data-action="reject"  data-show="planStatus==='PENDING' && hasPerm">驳回</button>
              <button class="ep-button--text" data-action="detail"  data-show="any">查看</button>
            </td>
          </tr>
          <tr>
            <td><input type="checkbox" /></td>
            <td><a class="ep-link">H260601-03</a></td>
            <td>Q355B</td>
            <td>2026-06-02</td>
            <td>110.00</td>
            <td><span class="ep-tag ep-tag--primary">已确认</span></td>
            <td>王工</td>
            <td>
              <button class="ep-button--text" data-action="issue"  data-show="planStatus==='CONFIRMED'">下发</button>
              <button class="ep-button--text" data-action="detail" data-show="any">查看</button>
            </td>
          </tr>
          <tr>
            <td><input type="checkbox" /></td>
            <td><a class="ep-link">H260531-08</a></td>
            <td>Q235B</td>
            <td>2026-05-31</td>
            <td>118.00</td>
            <td><span class="ep-tag ep-tag--success">已下发</span></td>
            <td>张工</td>
            <td>
              <button class="ep-button--text" data-action="detail" data-show="any">查看</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 分页 -->
    <div class="list-page__pager">
      <span>共 4 条</span>
      <span>10 条/页</span>
      <button class="ep-button ep-button--small">‹</button>
      <button class="ep-button ep-button--small ep-button--primary">1</button>
      <button class="ep-button ep-button--small">›</button>
    </div>
  </div>

  <!--
    ⑥ 表单字段（新增/编辑弹窗 FORM_MODAL，此处用注释声明，扫描时归入同页弹窗）
       planDate(date,必填,默认当天) | heatNo(input,必填,同月份+炉号唯一)
       steelGrade(select,必填,steel_grade,选钢种→带出合金配比) | planHeats(number,必填)
       planWeight(number,必填,精度2位>0) | remark(textarea,否)
    ⑦ 特殊交互：
       状态机 DRAFT→PENDING→CONFIRMED→ISSUED；批量删除仅 DRAFT 行可勾选、跨页不保留；
       选钢种联动带出合金配比（只读）。
  -->
</body>
</html>
